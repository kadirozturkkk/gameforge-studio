name: gameforge_studio
description: GameForge Studio - a mobile 2D game development environment.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  provider: ^6.1.2
  path: ^1.9.0
  path_provider: ^2.1.4
  sqflite: ^2.4.1
  uuid: ^4.5.1
  archive: ^3.6.1
  file_picker: '>=10.0.0 <12.0.0'

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  sqflite_common_ffi: ^2.3.4

flutter:
  uses-material-design: true
