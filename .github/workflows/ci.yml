name: CI

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install SQLite (for desktop tests)
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev

      - name: Generate missing platform folders
        run: flutter create --platforms=android,ios --org com.gameforge --project-name gameforge_studio .

      - name: Show versions
        run: flutter --version

      - name: Get dependencies
        run: flutter pub get && flutter pub deps --style=compact | grep -E "file_picker|sqflite |archive|provider"

      - name: Static analysis
        run: flutter analyze --no-fatal-infos

      - name: Automated tests
        run: flutter test --reporter expanded

      - name: Build Android APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GameForgeStudio-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
