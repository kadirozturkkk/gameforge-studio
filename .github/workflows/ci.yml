name: CI

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install SQLite (for desktop tests)
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev

      - name: Generate missing platform folders
        run: |
          flutter create --platforms=android,ios --org com.gameforge --project-name gameforge_studio .
          sed -i 's/android:label="gameforge_studio"/android:label="GameForge Studio"/' android/app/src/main/AndroidManifest.xml
          grep -n 'android:label' android/app/src/main/AndroidManifest.xml

      - name: Show versions
        run: flutter --version

      - name: Get dependencies
        run: flutter pub get && flutter pub deps --style=compact | grep -E "file_picker|sqflite |archive|provider"

      - name: Static analysis
        run: flutter analyze --no-fatal-infos

      - name: Automated tests
        run: flutter test --reporter expanded

      - name: Build Android APK
        run: flutter build apk --release

      - name: Rename APK
        run: mv build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/GameForgeStudio.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GameForgeStudio-apk
          path: build/app/outputs/flutter-apk/GameForgeStudio.apk
          retention-days: 30

      - name: Publish APK as a GitHub release (main branch only)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: GameForge Studio build ${{ github.run_number }}
          prerelease: true
          body: |
            Otomatik derleme / automatic build from commit ${{ github.sha }}.
            Analiz, testler ve APK derlemesi başarılı. / Analysis, tests and APK build passed.
          files: build/app/outputs/flutter-apk/GameForgeStudio.apk

  ios:
    # Builds an unsigned iOS app to verify the iOS build and to provide an
    # .ipa that can be signed for installation (Sideloadly / AltStore).
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate platform folders
        run: |
          flutter create --platforms=android,ios --org com.gameforge --project-name gameforge_studio .
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName GameForge Studio" ios/Runner/Info.plist

      - name: Get dependencies
        run: flutter pub get

      - name: Build iOS (no code signing)
        run: flutter build ios --release --no-codesign

      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qr GameForgeStudio-unsigned.ipa Payload
          ls -la GameForgeStudio-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: GameForgeStudio-ios-unsigned
          path: GameForgeStudio-unsigned.ipa
          retention-days: 30
